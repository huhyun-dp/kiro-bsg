# 화면 캡처 전용 프로파일.
# 실제 서비스 설정(application.yml)은 건드리지 않고, 캡처 hook 이 앱을 띄울 때만 사용한다.
# 실행 예: mvnw spring-boot:run "-Dspring-boot.run.profiles=screenshot"
#
# - H2 인메모리 DB 사용(MySQL 불필요)
# - 데모 시드 100명 비활성화(캡처 시 회원가입으로 만든 계정만 노출)
# - Thymeleaf 캐시 비활성화
spring:
  config:
    activate:
      on-profile: screenshot
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:lx_auth_screenshot;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      data-locations:
        - optional:classpath:db/seed/member-seed-true.sql
        - classpath:db/seed/screenshot-admin.sql
  thymeleaf:
    cache: false

app:
  security:
    bcrypt-strength: 4
