<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BSG Partners 문의 상세">
    <title th:text="${inquiry.title} + ' | BSG Partners'">문의 상세 | BSG Partners</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body class="member-page">
<header class="site-header">
    <a class="brand" th:href="@{/members}" href="/members" aria-label="BSG Partners 홈">BSG Partners</a>
    <nav class="member-nav" aria-label="회원 메뉴">
        <div class="member-chip">
            <span class="member-avatar" th:text="${#strings.substring(member.name(), 0, 1)}">사</span>
            <span><b th:text="${member.name()}">사용자</b><small th:text="${member.email()}">name@company.com</small></span>
        </div>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf}">
            <button class="logout-button" type="submit">로그아웃</button>
        </form>
    </nav>
</header>

<div class="member-layout">
    <aside th:replace="~{fragments/layout :: sidebar('inquiries')}"></aside>

    <main class="member-main">
        <section class="member-page-header">
            <p class="member-eyebrow">INQUIRY</p>
            <h1>문의 상세</h1>
        </section>

        <article class="inquiry-detail-card" aria-label="문의 상세 내용">
            <header class="inquiry-detail-header">
                <h2 class="inquiry-detail-title" th:text="${inquiry.title}">제목</h2>
                <dl class="inquiry-detail-meta">
                    <div>
                        <dt>작성자</dt>
                        <dd th:text="${inquiry.authorName}">홍길동</dd>
                    </div>
                    <div>
                        <dt>작성일</dt>
                        <dd th:text="${#temporals.format(inquiry.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01 12:00</dd>
                    </div>
                    <div>
                        <dt>조회수</dt>
                        <dd th:text="${inquiry.viewCount}">0</dd>
                    </div>
                </dl>
            </header>
            <div class="inquiry-detail-content" th:text="${inquiry.content}">내용</div>
            <section class="inquiry-attachments" th:if="${!#lists.isEmpty(inquiry.attachments)}" aria-label="첨부파일">
                <h3>첨부파일</h3>
                <ul class="inquiry-attachment-list">
                    <li th:each="attachment : ${inquiry.attachments}">
                        <a th:href="@{/inquiries/{inquiryId}/attachments/{attachmentId}/download(inquiryId=${inquiry.id},attachmentId=${attachment.id})}"
                           th:text="${attachment.originalFilename}">attachment.pdf</a>
                        <span th:text="${attachment.fileSize + ' bytes'}">0 bytes</span>
                    </li>
                </ul>
            </section>
        </article>

        <div class="inquiry-detail-actions">
            <a class="inquiry-back-button" th:href="@{/inquiries}" href="/inquiries">목록으로</a>
            <div class="inquiry-manage-actions" th:if="${canManage}">
                <a class="inquiry-edit-button" th:href="@{/inquiries/{id}/edit(id=${inquiry.id})}">수정</a>
                <form th:action="@{/inquiries/{id}/delete(id=${inquiry.id})}" method="post"
                      onsubmit="return confirm('이 문의를 삭제할까요? 삭제하면 목록에서 사라집니다.');">
                    <input type="hidden" name="_csrf" th:value="${_csrf}">
                    <button class="inquiry-delete-button" type="submit">삭제</button>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
