<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BSG Partners 문의 작성">
    <title>문의 작성 | BSG Partners</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body class="member-page">
<header class="site-header">
    <a class="brand" th:href="@{/inquiries}" href="/inquiries" aria-label="BSG Partners 홈">BSG Partners</a>
    <nav class="member-nav" aria-label="회원 메뉴">
        <div class="member-chip">
            <span class="member-avatar" th:text="${#strings.substring(member.name(), 0, 1)}">사</span>
            <span><b th:text="${member.name()}">사용자</b><small th:text="${member.email()}">name@company.com</small></span>
        </div>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf}">
            <button class="logout-button" type="submit">로그아웃</button>
        </form>
    </nav>
</header>

<div class="member-layout">
    <aside th:replace="~{fragments/layout :: sidebar('inquiries')}"></aside>

    <main class="member-main">
        <section class="member-page-header">
            <p class="member-eyebrow">INQUIRY</p>
            <h1 th:text="${formMode == 'edit'} ? '문의 수정' : '문의 작성'">문의 작성</h1>
            <p th:text="${formMode == 'edit'} ? '문의 내용을 수정해 주세요.' : '문의 내용을 입력해 주세요.'">문의 내용을 입력해 주세요.</p>
        </section>

        <section class="inquiry-form-card" aria-label="문의 작성 폼">
            <section class="field-group inquiry-existing-attachments" th:if="${formMode == 'edit'}"
                     aria-labelledby="existing-attachments-title">
                <h2 id="existing-attachments-title">기존 첨부파일</h2>
                <ul class="inquiry-attachment-list" th:if="${!#lists.isEmpty(existingAttachments)}">
                    <li th:each="attachment : ${existingAttachments}">
                        <span th:text="${attachment.originalFilename + ' (' + @fileSizeFormatter.format(attachment.fileSize) + ')'}">attachment.pdf (0 B)</span>
                        <form class="inquiry-attachment-delete-form"
                              th:action="@{/inquiries/{id}/attachments/{attachmentId}/delete(id=${inquiryId},attachmentId=${attachment.id})}"
                              method="post">
                            <input type="hidden" name="_csrf" th:value="${_csrf}">
                            <button class="inquiry-attachment-delete-button" type="submit">삭제</button>
                        </form>
                    </li>
                </ul>
                <p class="inquiry-attachment-list" th:if="${#lists.isEmpty(existingAttachments)}">기존 첨부파일이 없습니다.</p>
            </section>

            <form th:action="${formMode == 'edit'} ? @{/inquiries/{id}/edit(id=${inquiryId})} : @{/inquiries}"
                  method="post" enctype="multipart/form-data" th:object="${inquiryForm}" novalidate>
                <input type="hidden" name="_csrf" th:value="${_csrf}">

                <div class="field-group">
                    <label for="title">제목 <span class="field-required" aria-hidden="true">*</span></label>
                    <div class="input-wrap" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                        <input id="title" type="text" th:field="*{title}"
                               placeholder="제목을 입력해 주세요. (최대 20자)"
                               maxlength="20"
                               autocomplete="off">
                    </div>
                    <p class="field-error" th:if="${#fields.hasErrors('title')}"
                       th:errors="*{title}" role="alert"></p>
                </div>

                <div class="field-group inquiry-content-group">
                    <label for="content">내용 <span class="field-required" aria-hidden="true">*</span></label>
                    <div class="input-wrap textarea-wrap" th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'">
                        <textarea id="content" th:field="*{content}"
                                  placeholder="내용을 입력해 주세요. (최대 500자)"
                                  maxlength="500"
                                  rows="10"></textarea>
                    </div>
                    <p class="field-error" th:if="${#fields.hasErrors('content')}"
                       th:errors="*{content}" role="alert"></p>
                </div>

                <div class="field-group">
                    <label for="attachments" th:text="${formMode == 'edit'} ? '새 첨부파일 추가' : '첨부파일'">첨부파일</label>
                    <div class="input-wrap" th:classappend="${#fields.hasErrors('attachments')} ? 'is-invalid'">
                        <input id="attachments" type="file" th:field="*{attachments}" multiple
                               accept=".pdf,.png,.jpg,.jpeg">
                    </div>
                    <p class="field-hint inquiry-attachment-guidance">PDF, PNG, JPEG만 가능하며 파일당 최대 10 MiB, 최종 최대 5개 및 최종 전체 20 MiB까지 첨부할 수 있습니다.</p>
                    <p class="field-error" th:if="${#fields.hasErrors('attachments')}"
                       th:errors="*{attachments}" role="alert"></p>
                </div>

                <div class="inquiry-form-actions">
                    <a class="inquiry-back-button"
                       th:href="${formMode == 'edit'} ? @{/inquiries/{id}(id=${inquiryId})} : @{/inquiries}"
                       href="/inquiries">취소</a>
                    <button class="primary-button inquiry-submit-button" type="submit"
                            th:text="${formMode == 'edit'} ? '수정' : '등록'">등록</button>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
