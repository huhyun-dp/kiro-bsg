<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BSG Partners 문의 작성">
    <title>문의 작성 | BSG Partners</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body class="member-page">
<header class="site-header">
    <a class="brand" th:href="@{/members}" href="/members" aria-label="BSG Partners 홈">BSG Partners</a>
    <nav class="member-nav" aria-label="회원 메뉴">
        <div class="member-chip">
            <span class="member-avatar" th:text="${#strings.substring(member.name(), 0, 1)}">사</span>
            <span><b th:text="${member.name()}">사용자</b><small th:text="${member.email()}">name@company.com</small></span>
        </div>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf}">
            <button class="logout-button" type="submit">로그아웃</button>
        </form>
    </nav>
</header>

<div class="member-layout">
    <aside th:replace="~{fragments/layout :: sidebar('inquiries')}"></aside>

    <main class="member-main">
        <section class="member-page-header">
            <p class="member-eyebrow">INQUIRY</p>
            <h1>문의 작성</h1>
            <p>문의 내용을 입력해 주세요.</p>
        </section>

        <section class="inquiry-form-card" aria-label="문의 작성 폼">
            <form th:action="@{/inquiries}" method="post" th:object="${inquiryForm}" novalidate>
                <input type="hidden" name="_csrf" th:value="${_csrf}">

                <div class="field-group">
                    <label for="title">제목 <span class="field-required" aria-hidden="true">*</span></label>
                    <div class="input-wrap" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                        <input id="title" type="text" th:field="*{title}"
                               placeholder="제목을 입력해 주세요. (최대 20자)"
                               maxlength="20"
                               autocomplete="off">
                    </div>
                    <p class="field-error" th:if="${#fields.hasErrors('title')}"
                       th:errors="*{title}" role="alert"></p>
                </div>

                <div class="field-group inquiry-content-group">
                    <label for="content">내용 <span class="field-required" aria-hidden="true">*</span></label>
                    <div class="input-wrap textarea-wrap" th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'">
                        <textarea id="content" th:field="*{content}"
                                  placeholder="내용을 입력해 주세요. (최대 500자)"
                                  maxlength="500"
                                  rows="10"></textarea>
                    </div>
                    <p class="field-error" th:if="${#fields.hasErrors('content')}"
                       th:errors="*{content}" role="alert"></p>
                </div>

                <div class="inquiry-form-actions">
                    <a class="inquiry-back-button" th:href="@{/inquiries}" href="/inquiries">취소</a>
                    <button class="primary-button inquiry-submit-button" type="submit">등록</button>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
