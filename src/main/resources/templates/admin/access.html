<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BSG Partners 권한 관리">
    <title>권한 관리 | BSG Partners</title>
    <meta name="_csrf" th:content="${_csrf}" content="">
    <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body class="member-page">
<header th:replace="~{fragments/layout :: header('/admin/access')}"></header>

<div class="member-layout">
    <aside th:replace="~{fragments/layout :: sidebar('access')}"></aside>

    <main class="member-main">
        <section class="member-page-header">
            <p class="member-eyebrow">ACCESS</p>
            <h1>권한 관리</h1>
            <p>회원의 역할과 계정 상태를 조회하고 변경합니다.</p>
        </section>

        <section class="member-search-card" aria-label="권한 관리 검색">
            <form id="accessSearchForm" class="access-search-form">
                <div class="access-field">
                    <label for="accessKeyword">검색</label>
                    <input id="accessKeyword" name="keyword" type="search" maxlength="100"
                           placeholder="이름, 이메일 또는 휴대폰 번호">
                </div>
                <div class="access-field">
                    <label for="accessRole">역할</label>
                    <select id="accessRole" name="role">
                        <option value="">전체</option>
                        <option value="ADMIN">ADMIN</option>
                        <option value="OPERATOR">OPERATOR</option>
                        <option value="VIEWER">VIEWER</option>
                    </select>
                </div>
                <div class="access-field">
                    <label for="accessStatus">상태</label>
                    <select id="accessStatus" name="status">
                        <option value="">전체</option>
                        <option value="ACTIVE">활성</option>
                        <option value="SUSPENDED">정지</option>
                    </select>
                </div>
                <div class="access-field access-field-actions">
                    <button type="submit">조회</button>
                </div>
            </form>
        </section>

        <section class="member-grid-card" aria-label="회원 권한 목록">
            <div class="member-grid-heading">
                <h2>회원 목록</h2>
                <span id="accessCount" aria-live="polite">총 0명</span>
            </div>

            <p id="accessStatusMessage" class="access-status-message" role="status" aria-live="polite" hidden></p>

            <div id="accessGrid"></div>

            <div class="access-pagination" role="navigation" aria-label="페이지 이동">
                <button type="button" id="accessPrev" disabled>이전</button>
                <span id="accessPageInfo" aria-live="polite">1 / 1</span>
                <button type="button" id="accessNext" disabled>다음</button>
            </div>
        </section>
    </main>
</div>

<!-- 권한 변경 모달 -->
<div id="accessModal" class="access-modal" hidden>
    <div class="access-modal-backdrop" data-close="true"></div>
    <div class="access-modal-panel" role="dialog" aria-modal="true" aria-labelledby="accessModalTitle">
        <h2 id="accessModalTitle">권한 변경</h2>
        <p class="access-modal-target">
            <b id="accessModalName">회원</b>
            <small id="accessModalEmail">email</small>
        </p>

        <form id="accessChangeForm" class="access-modal-form">
            <input type="hidden" id="accessModalMemberId">
            <input type="hidden" id="accessModalVersion">

            <div class="access-field">
                <label for="accessModalRole">역할</label>
                <select id="accessModalRole" required>
                    <option value="ADMIN">ADMIN</option>
                    <option value="OPERATOR">OPERATOR</option>
                    <option value="VIEWER">VIEWER</option>
                </select>
            </div>

            <div class="access-field">
                <label for="accessModalStatus">상태</label>
                <select id="accessModalStatus" required>
                    <option value="ACTIVE">활성</option>
                    <option value="SUSPENDED">정지</option>
                </select>
            </div>

            <div class="access-field">
                <label for="accessModalReason">변경 사유</label>
                <textarea id="accessModalReason" rows="3" minlength="4" maxlength="500" required
                          placeholder="변경 사유를 4자 이상 입력해 주세요."></textarea>
            </div>

            <p id="accessModalMessage" class="access-modal-message" role="alert" aria-live="assertive" hidden></p>

            <div class="access-modal-actions">
                <button type="button" id="accessModalCancel" class="access-secondary-button">취소</button>
                <button type="submit" id="accessModalSubmit">변경</button>
            </div>
        </form>

        <section class="access-audit" aria-label="최근 권한 변경 이력">
            <h3>최근 변경 이력</h3>
            <p id="accessAuditMessage" class="access-audit-message" role="status" aria-live="polite" hidden></p>
            <ul id="accessAuditList" class="access-audit-list"></ul>
            <div class="access-pagination access-audit-pagination" role="navigation" aria-label="이력 페이지 이동">
                <button type="button" id="accessAuditPrev" disabled>이전</button>
                <span id="accessAuditPageInfo" aria-live="polite">1 / 1</span>
                <button type="button" id="accessAuditNext" disabled>다음</button>
            </div>
        </section>
    </div>
</div>

<!-- 저장 확인 다이얼로그 -->
<div id="accessConfirm" class="access-modal" hidden>
    <div class="access-modal-backdrop"></div>
    <div class="access-modal-panel access-confirm-panel" role="alertdialog" aria-modal="true"
         aria-labelledby="accessConfirmTitle" aria-describedby="accessConfirmBody">
        <h2 id="accessConfirmTitle">변경 내용을 저장할까요?</h2>
        <p id="accessConfirmBody" class="access-confirm-body">변경 사항을 확인해 주세요.</p>
        <div class="access-modal-actions">
            <button type="button" id="accessConfirmCancel" class="access-secondary-button">돌아가기</button>
            <button type="button" id="accessConfirmOk">저장</button>
        </div>
    </div>
</div>

<script src="https://uicdn.toast.com/grid/latest/tui-grid.min.js"></script>
<script th:src="@{/js/access.js}" src="/js/access.js"></script>
</body>
</html>
