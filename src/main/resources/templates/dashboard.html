<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BSG Partners 회원 페이지">
    <title>내 계정 | BSG Partners</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body class="dashboard-page">
<header class="site-header">
    <a class="brand" th:href="@{/dashboard}" href="/dashboard" aria-label="BSG Partners 홈">BSG Partners</a>
    <nav class="member-nav" aria-label="회원 메뉴">
        <div class="member-chip">
            <span class="member-avatar" th:text="${#strings.substring(member.name(), 0, 1)}">홍</span>
            <span><b th:text="${member.name()}">BSG</b><small th:text="${member.email()}">name@company.com</small></span>
        </div>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf}">
            <button class="logout-button" type="submit">로그아웃</button>
        </form>
    </nav>
</header>

<main class="dashboard-main">
    <section class="account-card" aria-labelledby="account-title">
        <h1 id="account-title"><span th:text="${member.name()}">BSG</span>님, 안녕하세요.</h1>
        <dl class="account-info">
            <div>
                <dt>이름</dt>
                <dd th:text="${member.name()}">BSG</dd>
            </div>
            <div>
                <dt>이메일</dt>
                <dd th:text="${member.email()}">name@company.com</dd>
            </div>
        </dl>
    </section>
</main>
</body>
</html>
