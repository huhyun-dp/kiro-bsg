<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BSG Partners 로그인">
    <title>로그인 | BSG Partners</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-panel" aria-labelledby="login-title">
        <a class="brand" th:href="@{/}" href="/" aria-label="BSG Partners 홈">BSG Partners</a>

        <div class="auth-content">
            <h1 id="login-title">로그인</h1>
            <p class="auth-intro">계정 정보를 입력해 주세요.</p>

            <div class="alert alert-success" role="status" th:if="${successMessage}" th:text="${successMessage}">
                회원가입이 완료되었습니다.
            </div>

            <form class="auth-form" th:action="@{/login}" th:object="${loginForm}" method="post" novalidate>
                <input type="hidden" name="_csrf" th:value="${_csrf}">

                <div class="alert alert-error" role="alert" th:if="${#fields.hasGlobalErrors()}">
                    <span th:each="error : ${#fields.globalErrors()}" th:text="${error}">로그인 정보를 확인해 주세요.</span>
                </div>

                <div class="field-group">
                    <label for="email">이메일</label>
                    <div class="input-wrap" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                        <input id="email" type="email" th:field="*{email}" autocomplete="username"
                               placeholder="name@company.com" autofocus aria-describedby="email-error">
                    </div>
                    <p id="email-error" class="field-error" th:if="${#fields.hasErrors('email')}"
                       th:errors="*{email}">이메일을 확인해 주세요.</p>
                </div>

                <div class="field-group">
                    <label for="password">비밀번호</label>
                    <div class="input-wrap" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                        <input id="password" type="password" th:field="*{password}" autocomplete="current-password"
                               placeholder="비밀번호를 입력해 주세요" aria-describedby="password-error">
                    </div>
                    <p id="password-error" class="field-error" th:if="${#fields.hasErrors('password')}"
                       th:errors="*{password}">비밀번호를 확인해 주세요.</p>
                </div>

                <button class="primary-button" type="submit">로그인</button>
            </form>

            <p class="auth-switch">아직 계정이 없으신가요? <a th:href="@{/signup}" href="/signup">회원가입</a></p>
        </div>

        <p class="auth-footer">© BSG Partners</p>
    </section>
</main>
</body>
</html>
