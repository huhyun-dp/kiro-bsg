spring:
  application:
    name: session-auth
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/lx_auth?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&connectionTimeZone=Asia/Seoul&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:lx_app}
    password: ${DB_PASSWORD:lx_app_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 3000
  sql:
    init:
      mode: always
      encoding: UTF-8
      data-locations: optional:classpath:db/seed/member-seed-${SEED_DEMO_MEMBERS:true}.sql
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    database-change-log-table: databasechangelog
    database-change-log-lock-table: databasechangeloglock
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
  servlet:
    multipart:
      max-file-size: 10485760B
      max-request-size: 22020096B

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: BSG_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never

app:
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
  inquiry-attachment:
    storage-path: ${INQUIRY_ATTACHMENT_STORAGE_PATH:}
    cleanup-on-startup: ${INQUIRY_ATTACHMENT_CLEANUP_ON_STARTUP:false}
