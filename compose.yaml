services:
  mysql:
    image: mysql:8.4.10
    container_name: lx-auth-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lx_auth}
      MYSQL_USER: ${MYSQL_USER:-lx_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lx_app_password}
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - lx-auth-mysql-data:/var/lib/mysql

volumes:
  lx-auth-mysql-data:

